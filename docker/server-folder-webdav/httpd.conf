ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 2345

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
# The app's connection check GETs the root folder; mod_dav serves no GET there.
LoadModule autoindex_module modules/mod_autoindex.so

User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogLevel warn

DavLockDB /dav-lock/DavLock
# Mtime ETags turn weak for a second after each write, and the app sends no
# If-Match for weak tags. Content digests stay strong.
FileETag Digest
# Sync files can grow past the 1 MB some proxies default to; nginx is raised
# to match in the app image.
LimitRequestBody 104857600
DocumentRoot "/data"

# No CORS headers: the browser reaches this server only through the app's own
# origin (/webdav/), so requests are same-origin.
<Directory "/data">
  Dav On
  Options Indexes
  AuthType Basic
  AuthName "Super Productivity sync"
  AuthBasicProvider file
  AuthUserFile /usr/local/apache2/conf/webdav.htpasswd
  Require valid-user
</Directory>
